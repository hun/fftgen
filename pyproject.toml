[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fftgen"
version = "0.1.0"
description = "Parameterized streaming FFT/IFFT Verilog core generator (Xilinx)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "CERN-OHL-S-2.0 OR LicenseRef-Commercial (closed-source licence on request; contact hannes.klas@gmail.com)" }

[project.optional-dependencies]
dev = ["numpy"]


[tool.pyright]
# Modules use flat absolute imports ("from config import ...") with
# sys.path.insert() pointing at src/; surface that to pyright statically.
extraPaths = ["src"]
